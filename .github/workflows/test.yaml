name: CI

on:
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote image to production?'
        required: false
        default: 'false'
  push:
    branches:
      - "staging"

jobs:

  build:
    name: Build
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: echo "Staging went off!"

  promote:
    name: Promote
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.promote == 'true'
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test
        run: echo "Main went off!"
