name: CI - Build & Push Container Image

on:
  workflow_dispatch:
  push:
    branches:
      - "staging"

jobs:
  promote:
    name: Promote
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/main'
    runs-on:
      - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Test
        run: echo "Success!"
